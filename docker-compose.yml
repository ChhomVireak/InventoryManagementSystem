services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
