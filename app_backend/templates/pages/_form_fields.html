{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
<div class="row">
{% for field in form %}
    <div class="{% if field.name == 'notes' or field.name == 'reason' or field.name == 'reference' %}col-sm-6{% else %}col-sm-4{% endif %}">
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger text-sm">{{ error }}</div>{% endfor %}
            {% if field.help_text %}<small class="form-text text-muted">{{ field.help_text }}</small>{% endif %}
        </div>
    </div>
{% endfor %}
</div>
