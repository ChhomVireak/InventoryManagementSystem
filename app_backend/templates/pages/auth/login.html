{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IMS | Log in</title>
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><b>Inventory</b> MS</div>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Sign in to start your session</p>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>{% endif %}
            <div class="card card-outline card-info mt-4 mb-4">
                <div class="card-header py-2 text-center">
                    <h3 class="card-title float-none text-info" style="font-size: 0.95rem;">
                        <i class="fas fa-info-circle mr-1"></i> Demo Account
                    </h3>
                </div>
                <div class="card-body p-3">
                    <table class="table table-sm table-borderless mb-2">
                        <tr>
                            <td class="text-muted"><i class="fas fa-user mr-2"></i>Username</td>
                            <td class="text-right"><code id="demo-user">admin</code></td>
                        </tr>
                        <tr>
                            <td class="text-muted"><i class="fas fa-lock mr-2"></i>Pass AllUser</td>
                            <td class="text-right"><code id="demo-pass">Ims@12345</code></td>
                        </tr>

                    </table>

                </div>
            </div>
            <form method="post" action="/login/">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="input-group mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" autofocus required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-user"></span></div>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-lock"></span></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
